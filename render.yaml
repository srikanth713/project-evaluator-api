services:
  - type: web
    name: msgi-project-evaluator-api
    runtime: docker
    plan: free
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: GEMINI_API_KEY
        sync: false          # entered in the Render dashboard, never committed
      - key: GITHUB_TOKEN
        sync: false
      - key: API_ACCESS_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false          # e.g. https://your-frontend.example.com (no "*" in production)
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: RATE_LIMIT_REQUESTS
        value: "10"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
